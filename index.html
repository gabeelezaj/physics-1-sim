<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mechanism Sandbox</title>
  </head>
  <body>
    <header id="toolbar">
      <div class="brand">Mechanism Sandbox</div>
      <div class="group">
        <button id="btn-play" class="primary" title="Play / pause (Space)">▶ Play</button>
        <button id="btn-step" title="Advance 10 ms">Step</button>
        <button id="btn-reset" title="Back to initial conditions (R)">Reset</button>
        <label class="slider-label" title="Simulation speed">
          <span>Speed</span>
          <input id="time-scale" type="range" min="-3" max="1" step="0.05" value="0" />
          <span id="time-scale-val" class="mono">1.00×</span>
        </label>
        <span id="time" class="mono">t = 0.000 s</span>
      </div>
      <div class="group">
        <label class="check"><input id="gravity-on" type="checkbox" checked /> Gravity</label>
        <label class="num"><span>g</span><input id="gravity-g" type="number" step="0.01" value="9.81" /><span class="unit">m/s²</span></label>
      </div>
      <div class="group">
        <label class="check"><input id="snap" type="checkbox" checked /> Snap</label>
        <label class="check"><input id="show-fbd" type="checkbox" /> FBD</label>
        <label class="check"><input id="show-labels" type="checkbox" checked /> Labels</label>
      </div>
      <div class="group">
        <button id="btn-undo" title="Undo (Ctrl/⌘ Z)">Undo</button>
        <button id="btn-redo" title="Redo (Ctrl/⌘ Shift Z)">Redo</button>
      </div>
      <div class="group">
        <select id="preset-select" title="Load a preset scene">
          <option value="">Presets…</option>
        </select>
        <button id="btn-new">New</button>
        <button id="btn-save" title="Download the scene as JSON">Save</button>
        <button id="btn-load" title="Load a scene JSON">Load</button>
        <input id="file-input" type="file" accept="application/json,.json" hidden />
      </div>
    </header>
    <main>
      <aside id="palette"></aside>
      <section id="stage">
        <canvas id="canvas"></canvas>
        <div id="hint"></div>
        <div id="warnings"></div>
        <div id="mode-banner" hidden></div>
      </section>
      <aside id="side">
        <section id="props" class="panel"></section>
        <section id="analysis" class="panel">
          <nav class="tabs">
            <button data-tab="plots" class="active">Plots</button>
            <button data-tab="modes">Equilibrium &amp; modes</button>
            <button data-tab="equations">Equations</button>
            <button data-tab="forces">Forces</button>
          </nav>
          <div class="tab-body" id="tab-plots"></div>
          <div class="tab-body" id="tab-modes" hidden></div>
          <div class="tab-body" id="tab-equations" hidden></div>
          <div class="tab-body" id="tab-forces" hidden></div>
        </section>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
